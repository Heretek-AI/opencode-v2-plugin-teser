name: publish
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm for OIDC trusted publishing (requires npm >= 11.5)
        run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node --input-type=module -e "import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync('package.json', 'utf8')).version)")"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Refusing to publish: tag ${GITHUB_REF_NAME} (version ${TAG_VERSION}) does not match package.json version ${PKG_VERSION}" >&2
            exit 1
          fi
          echo "Publishing version ${PKG_VERSION} from tag ${GITHUB_REF_NAME}"
      - run: npm publish --provenance --access public
