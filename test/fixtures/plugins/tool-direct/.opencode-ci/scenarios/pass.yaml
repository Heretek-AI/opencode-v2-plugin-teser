id: tool-direct-pass
description: echo_tool is offered directly (codemode false) and returns echo:hi
mode: scripted
prompt: Say hi through the echo tool.
script:
  - toolCalls:
      - name: echo_tool
        arguments: { text: hi }
  - text: done
expect:
  exitCode: 0
  tools:
    - name: echo_tool
      status: completed
      output: { contains: "echo:hi" }
  # codemode is false, so the call must not go through Code Mode's execute tool.
  noTools: [execute]
  request:
    nth: 1
    tools: { includes: [echo_tool] }
